<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRONO Enterprise — Fleet Command Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #03070d;
            --card-bg: rgba(6, 16, 26, 0.85);
            --border: #00ffcc33;
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.25);
            --text: #e2f1f8;
            --text-dim: #749aa8;
            --danger: #ff4757;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Background Tech Grid & Ambient Glow */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }
        .login-card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--primary-glow);
            backdrop-filter: blur(16px);
        }
        .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }
        .reactor-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 16px var(--primary);
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 24px;
        }
        .title {
            font-family: 'Cascadia Code', monospace;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary);
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #010a12;
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #030a10;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 8px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-1px);
        }
        .error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <div class="reactor-badge">❖</div>
            <div class="title">B.R.O.N.O</div>
            <div class="subtitle">FLEET COMMAND & LICENSING</div>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" id="username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label>Master Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">AUTHENTICATE</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>
        <div class="footer-note">
            Default credentials: <code>admin</code> / <code>admin123</code>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    err.innerText = data.detail || 'Authentication failed.';
                    err.style.display = 'block';
                }
            } catch (ex) {
                err.innerText = 'Server unreachable.';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
